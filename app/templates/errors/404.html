{% extends 'base.html' %}
{% block title %}404 Not Found — BBMKU UFMS{% endblock %}

{% block content %}
<div style="text-align:center; padding:60px 20px;">
  <div style="font-size:64px; color:var(--gold-dark); font-weight:900;">404</div>
  <h2 style="font-size:22px; color:var(--navy-primary); margin:12px 0;">Official Record or Page Not Found</h2>
  <p style="color:var(--text-muted); max-width:540px; margin:0 auto 24px;">
    The requested file record, document, or route does not exist in the BBMKU registry.
  </p>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">
    &larr; Return to Dashboard
  </a>
</div>
{% endblock %}
